[project]
name = "weavz-agno-mcp-example"
version = "0.1.0"
description = "Agno agents connected to Weavz over MCP"
requires-python = ">=3.11,<3.14"
dependencies = ["agno[mcp]>=3,<4", "openai>=2,<3", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
