[project]
name = "weavz-smolagents-mcp-example"
version = "0.1.0"
description = "smolagents agent connected to Weavz over MCP"
requires-python = ">=3.11,<3.14"
dependencies = ["smolagents[mcp]==1.26.0", "mcp>=1.30,<2", "openai>=1", "pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.uv]
package = false
