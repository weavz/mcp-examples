name: Example catalog and SDK setup contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: python3 tools/check_catalog.py
      - run: python3 tools/render_index.py
      - run: python3 tools/discovery.py
      - run: git diff --exit-code -- README.md
      - run: git diff --exit-code -- examples docs/integrations.md examples-index.json
